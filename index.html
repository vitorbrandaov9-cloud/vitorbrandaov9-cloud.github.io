<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página inicial</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f2f6ff;
        color: #1e293b;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: min(320px, calc(100% - 32px));
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
      }

      .botao {
        display: block;
        padding: 14px 20px;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        transition: 0.2s;
      }

      .botao:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Menu principal</h1>
      <a class="botao" href="agua.html">Beba água</a>
      <a class="botao" href="aulaJs.html">Aula JS</a>
    </main>
  </body>
</html>
