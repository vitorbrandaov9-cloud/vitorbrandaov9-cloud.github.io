<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Beba água</title>
  </head>
    <style>
              .botao {
        display: block;
        padding: 14px 20px;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        transition: 0.2s;
      }

      .botao:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }

    </style>
  <body>
         <a class="botao" href="index.html">Tela inicial</a>
    <h1>Água</h1>
    <h3>Objetivo: 2 L</h3>

    <div class="cup">
      <div class="restante" id="restante">
        <span id="litros"></span>
        <small>restantes</small>
      </div>

      <div class="porcentagem" id="porcentagem"></div>
      <div class="agua-caindo" aria-hidden="true">
        <span class="gota gota-1"></span>
        <span class="gota gota-2"></span>
        <span class="gota gota-3"></span>
        <span class="gota gota-4"></span>
      </div>
    </div>

    <p class="text">Selecione quantos copos você quer beber</p>

    <div class="cups">
      <div class="cup cup-false">250 ml</div>
      <div class="cup cup-small">250 ml</div>
      <div class="cup cup-small">250 ml</div>
      <div class="cup cup-small">250 ml</div>
      <div class="cup cup-small">250 ml</div>
      <div class="cup cup-small">250 ml</div>
      <div class="cup cup-small">250 ml</div>
      <div class="cup cup-small">250 ml</div>
      <div class="cup cup-small">250 ml</div>
       <div class="cup cup-small">250 ml</div>
        <div class="cup cup-small">250 ml</div>
      <div class="cup cup-false">250 ml</div>
    </div>

    <div class="easteregg" id="easteregg" aria-hidden="true">
      <img src= "images.jpg" alt="Easter egg" >
    </div>

    <script src="script.js"></script>
  </body>
</html>
